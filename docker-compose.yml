services:
  api: 
    build: ./backend
    container_name: guarded-api
    ports:
      - '30000:3000'
    env_file: './backend/.env.staging'
  ui:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL}
    container_name: guarded-ui
    ports: 
      - '30001:3001'
    env_file: './frontend/.env.staging'
    depends_on:
      - api