services:
  api: 
    build: ./backend
    container_name: guarded_backend
    ports:
      - '4000:4000'
    volumes:
      - ./backend:/app
      - ./backend/node_modules:/app/node_modules
    env_file: './backend/.env'
  client:
    build: ./frontend
    container_name: guarded_frontend
    ports: 
      - '3000:3000'
    volumes:
      - ./frontend:/app
      - ./frontend/node_modules:/app/node_modules
    env_file: './frontend/.env'